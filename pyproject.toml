[project]
name = "synthetic-doc-gen"
version = "0.1.0"
description = "Générateur de documents médicaux entièrement fictifs (PDF) pour tests, marqués DOCUMENT SYNTHÉTIQUE TEST."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["reportlab>=4.0"]

[project.scripts]
synthetic-doc-gen = "synthetic_doc_gen.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pypdf>=5", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synthetic_doc_gen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
